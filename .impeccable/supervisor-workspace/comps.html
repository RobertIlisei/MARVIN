<!doctype html>
<!--
  Supervisor workspace comps (supervisor brief §13). Static mockups, not product code.
  Tokens are DESIGN.md's ("The Quiet Instrument"); the orb is cropped from docs/assets/marvin-ide.png.
  Render: npx playwright screenshot "file://…/comps.html#<comp>" out.png  (see render.sh)
-->
<html>
<head>
<meta charset="utf-8">
<style>
:root, .dark {
  --chrome:#181818; --content:#1F1F1F; --inset:#262626; --hair:#2B2B2B;
  --text:#D4D4D4; --muted:#9D9D9D; --sel:#37373D; --hover:#2A2D2E;
  --accent:#3B82F6; --accent-text:#6AAEFF; --chip-stroke:#666666;
  --orange:#FF9F0A; --red:#D95440; --green:#6BD18F; --secondary:rgba(235,235,245,.62); --tertiary:rgba(235,235,245,.38);
  --orb:url(assets/orb-dark.png);
}
.light {
  --chrome:#F3F3F3; --content:#FFFFFF; --inset:#F7F7F7; --hair:#E5E5E5;
  --text:#1F1F1F; --muted:#6E6E6E; --sel:#E4E6F1; --hover:#F0F0F0;
  --accent:#0A64D8; --accent-text:#0A58C2; --chip-stroke:#8A8A8A;
  --orange:#C46A00; --red:#BC3925; --green:#257641; --secondary:rgba(60,60,67,.66); --tertiary:rgba(60,60,67,.42);
  --orb:url(assets/orb-light.png);
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system, system-ui, "SF Pro Text", sans-serif; color:var(--text); background:#000; -webkit-font-smoothing:antialiased; }
.mono { font-family:ui-monospace, "SF Mono", Menlo, monospace; }
.win, .light, .dark { color:var(--text); }
.win { display:flex; flex-direction:column; background:var(--chrome); overflow:hidden; }
.titlebar { height:38px; display:flex; align-items:center; gap:8px; padding:0 14px; border-bottom:1px solid var(--hair); font-size:12px; font-weight:600; }
.lights { display:flex; gap:8px; margin-right:14px; } .lights i { width:12px; height:12px; border-radius:50%; display:block; }
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.titlebar .sub { font-weight:400; color:var(--muted); font-size:11px; }
.body { flex:1; display:flex; min-height:0; }
.rail { width:44px; border-right:1px solid var(--hair); display:flex; flex-direction:column; align-items:center; padding-top:2px; flex:none; }
.rail b { width:44px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--muted); position:relative; }
.rail b.sel { color:var(--text); background:var(--sel); }
.rail b.sel::before { content:""; position:absolute; left:0; top:6px; bottom:6px; width:2px; background:var(--accent); }
.rail b.on { color:var(--text); background:var(--sel); }
.rail b .badge { position:absolute; right:7px; top:5px; min-width:13px; height:13px; border-radius:7px; background:var(--orange); color:#fff; font-size:8.5px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 3px; }
.side { width:260px; border-right:1px solid var(--hair); flex:none; overflow:hidden; display:flex; flex-direction:column; }
.center { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--content); border-right:1px solid var(--hair); }
.right { width:480px; flex:none; display:flex; flex-direction:column; background:var(--chrome); }
.statusbar { height:22px; border-top:1px solid var(--hair); display:flex; align-items:center; gap:14px; padding:0 10px; font-size:10.5px; color:var(--muted); }

/* pane vocabulary */
.ph { height:38px; display:flex; align-items:center; padding:0 10px; gap:6px; }
.ph .t { font-size:11px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--muted); flex:1; }
.ib { width:22px; height:22px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); flex:none; }
.sh { display:flex; align-items:center; gap:6px; padding:10px 12px 4px; font-size:9.5px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--muted); }
.cnt { font-size:9.5px; padding:0 5px; border-radius:7px; background:color-mix(in srgb, var(--muted) 18%, transparent); color:var(--text); font-variant-numeric:tabular-nums; }
.cnt.warn { background:color-mix(in srgb, var(--orange) 22%, transparent); }
.row { display:flex; align-items:flex-start; gap:8px; padding:4px 12px; margin:0 2px; border-radius:5px; }
.row.sel { background:var(--sel); }
.row .g { width:14px; flex:none; text-align:center; font-size:11px; line-height:16px; color:var(--muted); }
.row .m { flex:1; min-width:0; }
.row .tt { font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:16px; }
.row .st { font-size:10px; color:var(--secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:500; padding:3px 8px; border-radius:5px; border:.5px solid var(--chip-stroke); background:var(--inset); color:var(--text); white-space:nowrap; flex:none; }
.chip.primary { color:var(--accent-text); background:color-mix(in srgb, var(--accent) 15%, transparent); border-color:color-mix(in srgb, var(--accent) 45%, transparent); }
.chip.red { color:var(--red); background:color-mix(in srgb, var(--red) 15%, transparent); border-color:color-mix(in srgb, var(--red) 40%, transparent); }
.chip.dis { opacity:.45; }
.chip.c { font-size:10px; padding:2px 7px; }
.notice { margin:6px 12px; padding:6px 10px; border-radius:6px; font-size:10.5px; display:flex; gap:7px; align-items:flex-start; }
.notice.warn { background:color-mix(in srgb, var(--orange) 8%, transparent); }
.notice.err { background:color-mix(in srgb, var(--red) 8%, transparent); }
.notice .d { font-family:ui-monospace,monospace; font-size:10px; color:var(--secondary); margin-top:2px; }
.meter { width:56px; height:4px; border-radius:3px; background:color-mix(in srgb, var(--muted) 22%, transparent); overflow:hidden; flex:none; }
.meter i { display:block; height:100%; background:var(--muted); }
.meter.o i { background:var(--orange); } .meter.r i { background:var(--red); }
svg.ic { width:12px; height:12px; flex:none; vertical-align:-2px; }
svg.ic.s { width:11px; height:11px; }

/* sessions-pane supervisor line (§13.6) */
.supline { display:flex; align-items:center; gap:6px; margin:0 8px 2px; padding:5px 8px; border-radius:5px; font-size:11px; border:1px solid var(--hair); background:var(--inset); }
.supline .s { color:var(--secondary); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }

/* card (§6.2) */
.card { background:var(--inset); border:1px solid var(--hair); border-radius:6px; padding:8px; font-size:11px; }
.card .why { font-weight:600; font-size:10.5px; display:flex; gap:5px; align-items:center; margin-bottom:5px; }
.card .act { display:flex; gap:6px; align-items:center; margin-bottom:3px; }
.badge-t { font-family:ui-monospace,monospace; font-size:10.5px; padding:1px 5px; border-radius:3px; background:color-mix(in srgb, var(--muted) 18%, transparent); }
.card .raw { font-family:ui-monospace,monospace; font-size:11px; margin-bottom:3px; }
.link { color:var(--accent-text); }
.card .rec { color:var(--secondary); margin:6px 0 3px; display:flex; gap:5px; }
.card .rec b { color:var(--text); font-weight:600; }
.card .why2 { color:var(--secondary); padding-left:17px; margin-bottom:5px; }
.card .gr { color:var(--secondary); margin-bottom:7px; }
.card .chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.settled { font-size:11px; color:var(--secondary); display:flex; gap:6px; align-items:center; padding:6px 8px; border:1px solid var(--hair); border-radius:6px; }

/* center workspace */
.wh { height:38px; display:flex; align-items:center; gap:8px; padding:0 10px 0 12px; background:var(--chrome); border-bottom:1px solid var(--hair); flex:none; }
.wh .title { font-size:12px; font-weight:600; }
.wh .mode { font-size:11px; color:var(--secondary); white-space:nowrap; }
.wh .money { font-family:ui-monospace,monospace; font-size:10.5px; color:var(--secondary); white-space:nowrap; font-variant-numeric:tabular-nums; }
.wh .sp { flex:1; min-width:0; }
.conv { flex:1; min-height:0; overflow:hidden; display:flex; justify-content:center; }
.col { width:100%; max-width:760px; padding:18px 16px 0; display:flex; flex-direction:column; gap:14px; }
.ub { align-self:flex-end; max-width:78%; background:var(--inset); border:1px solid var(--hair); border-radius:12px; padding:8px 12px; font-size:13px; line-height:18px; }
.ub .who { font-family:ui-monospace,monospace; font-size:9.5px; letter-spacing:2px; color:var(--accent-text); opacity:.8; text-align:right; margin-bottom:2px; }
.rep { padding-left:66px; font-size:13px; line-height:19px; }
.rep .who { font-family:ui-monospace,monospace; font-size:9.5px; letter-spacing:2px; color:var(--muted); margin-bottom:3px; display:flex; gap:5px; align-items:center; }
.rep .time { font-size:10.5px; color:var(--secondary); margin-top:2px; font-family:ui-monospace,monospace; }
.rep .card { margin-top:8px; }
.meta { padding-left:66px; font-size:11px; color:var(--secondary); display:flex; gap:6px; align-items:center; }
.composer-wrap { display:flex; justify-content:center; padding:10px 16px 12px; flex:none; }
.composer { width:100%; max-width:760px; height:64px; border-radius:10px; background:var(--inset); border:1px solid var(--hair); padding:8px 12px; font-size:13px; color:var(--secondary); position:relative; }
.composer .send { position:absolute; right:8px; bottom:8px; width:22px; height:22px; border-radius:11px; background:color-mix(in srgb, var(--muted) 40%, transparent); color:var(--content); display:flex; align-items:center; justify-content:center; font-size:12px; }

/* right column */
.brain { height:250px; display:flex; flex-direction:column; align-items:center; padding-top:10px; border-bottom:1px solid var(--hair); flex:none; }
.orb { width:180px; height:150px; background:var(--orb) center/contain no-repeat; }
.orb.still { opacity:.45; }
.cap1 { font-family:ui-monospace,monospace; font-size:9px; letter-spacing:2.5px; color:var(--tertiary); display:flex; gap:5px; align-items:center; margin-top:4px; }
.cap2 { font-family:ui-monospace,monospace; font-size:12px; color:var(--secondary); margin-top:1px; display:flex; gap:5px; align-items:center; }
.cap3 { font-size:10.5px; color:var(--secondary); margin-top:6px; padding:0 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.seg { margin:10px 12px 6px; display:flex; border:.5px solid var(--chip-stroke); border-radius:5px; overflow:hidden; flex:none; }
.seg span { flex:1; text-align:center; font-size:11px; padding:3px 0; border-left:.5px solid var(--chip-stroke); }
.seg span:first-child { border-left:none; }
.seg span.on { background:var(--sel); font-weight:600; }
.insp { flex:1; min-height:0; overflow:hidden; }
.trow { display:flex; gap:8px; padding:6px 12px; align-items:flex-start; border-bottom:1px solid color-mix(in srgb, var(--hair) 60%, transparent); }
.trow .m { flex:1; min-width:0; }
.trow .tt { font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.trow .st { font-size:10.5px; color:var(--secondary); margin-top:1px; }
.deleg { display:inline-flex; gap:4px; align-items:center; font-size:10.5px; padding:2px 6px; border-radius:5px; border:.5px solid var(--chip-stroke); background:var(--inset); white-space:nowrap; flex:none; }
.lrow { padding:5px 12px; border-bottom:1px solid color-mix(in srgb, var(--hair) 60%, transparent); }
.lrow .l1 { display:flex; gap:6px; align-items:center; font-size:11px; }
.lrow .l1 .v { font-family:ui-monospace,monospace; }
.lrow .l1 .tm { margin-left:auto; font-family:ui-monospace,monospace; font-size:10.5px; color:var(--muted); }
.lrow .l2 { font-size:11px; color:var(--secondary); padding-left:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.set { padding:4px 12px; font-size:11px; }
.set h4 { font-size:11px; font-weight:500; color:var(--muted); margin:10px 0 6px; display:flex; align-items:center; }
.tg { display:flex; gap:8px; margin-bottom:8px; }
.sw { width:26px; height:15px; border-radius:8px; background:color-mix(in srgb, var(--muted) 35%, transparent); position:relative; flex:none; margin-top:1px; }
.sw::after { content:""; position:absolute; top:1.5px; left:1.5px; width:12px; height:12px; border-radius:6px; background:#fff; }
.sw.on { background:var(--accent); } .sw.on::after { left:12.5px; }
.sw.dis { opacity:.4; }
.tg .st { color:var(--secondary); font-size:11px; }
.stepper { display:inline-flex; align-items:center; gap:4px; }
.stepper .f { width:54px; height:20px; border-radius:4px; border:.5px solid var(--chip-stroke); background:var(--content); font-size:11px; display:flex; align-items:center; padding:0 6px; font-family:ui-monospace,monospace; }

/* editor-ish file placeholder in off comp */
.tabstrip { height:30px; display:flex; align-items:center; gap:4px; padding:0 8px; border-bottom:1px solid var(--hair); background:var(--chrome); font-size:11px; color:var(--secondary); }
.tabstrip .tab { padding:4px 10px; border-radius:5px; }
.tabstrip .tab.on { background:var(--content); color:var(--text); border:1px solid var(--hair); }
.form { width:100%; max-width:520px; padding:26px 20px; display:flex; flex-direction:column; gap:12px; font-size:12px; }
.form .lead { color:var(--secondary); line-height:17px; }
.form label { font-size:11px; color:var(--muted); font-weight:500; display:block; margin-bottom:4px; }
.ta { height:64px; border-radius:6px; border:.5px solid var(--chip-stroke); background:var(--inset); padding:6px 8px; color:var(--tertiary); font-size:12px; }
.picker { font-size:11px; padding:2px 8px; border-radius:5px; border:.5px solid var(--chip-stroke); background:var(--inset); }
.btn { font-size:12px; padding:4px 12px; border-radius:6px; border:.5px solid var(--chip-stroke); background:var(--inset); display:inline-block; }

/* state sheet */
.sheet { padding:24px; display:grid; grid-template-columns:repeat(2, 640px); gap:18px 24px; background:var(--chrome); }
.cell { border:1px solid var(--hair); border-radius:6px; overflow:hidden; background:var(--chrome); }
.cell .lab { font-family:ui-monospace,monospace; font-size:10px; letter-spacing:1px; color:var(--muted); padding:6px 10px; border-bottom:1px solid var(--hair); text-transform:uppercase; }
.cell .inner { display:flex; }
.cell .inner .l { width:260px; border-right:1px solid var(--hair); padding:6px 0; }
.cell .inner .r { flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 0; }
.cell .inner .r .orb { width:120px; height:96px; }
.cell .whwrap { border-bottom:1px solid var(--hair); }
.annot { font-size:10.5px; color:var(--secondary); padding:6px 10px; border-top:1px solid var(--hair); line-height:15px; }
.h1 { grid-column:1 / -1; font-size:15px; font-weight:600; }
.h1 .sub { display:block; font-size:11px; font-weight:400; color:var(--secondary); margin-top:3px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------- icons (SF Symbols stand-ins) ----------
const I = {
  bino:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="4.2" cy="10.5" r="3"/><circle cx="11.8" cy="10.5" r="3"/><path d="M7.2 10.5h1.6M2.2 8.5 4 3h2.3l.9 4.6M13.8 8.5 12 3H9.7l-.9 4.6"/></svg>`,
  pause:`<svg class="ic" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3" width="3" height="10" rx=".8"/><rect x="9.5" y="3" width="3" height="10" rx=".8"/></svg>`,
  play:`<svg class="ic" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.8v10.4l8.6-5.2z"/></svg>`,
  stop:`<svg class="ic s" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>`,
  more:`<svg class="ic" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>`,
  x:`<svg class="ic s" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>`,
  chev:`<svg class="ic s" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5 10.5 8 6 12.5"/></svg>`,
  down:`<svg class="ic s" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 6 8 10.5 12.5 6"/></svg>`,
  warn:`<svg class="ic" viewBox="0 0 16 16"><path d="M8 1.8 15 14H1z" fill="var(--orange)"/><path d="M8 6v4M8 11.6v.6" stroke="#fff" stroke-width="1.5"/></svg>`,
  err:`<svg class="ic" viewBox="0 0 16 16"><path d="M5 1.5h6L14.5 5v6L11 14.5H5L1.5 11V5z" fill="var(--red)"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="#fff" stroke-width="1.5"/></svg>`,
  hand:`<svg class="ic" viewBox="0 0 16 16" fill="var(--orange)"><path d="M5 7V3a1 1 0 0 1 2 0v4-5a1 1 0 0 1 2 0v5-4a1 1 0 0 1 2 0v5-2a1 1 0 0 1 2 0v4c0 3-2 5-5 5s-4.5-1.5-6-4L1.6 8.3a1 1 0 0 1 1.6-1.1L5 9z"/></svg>`,
  eye:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z"/><circle cx="8" cy="8" r="2"/></svg>`,
  qb:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 3.5h12v8H7l-3 2.5v-2.5H2z"/><path d="M6.6 6a1.5 1.5 0 1 1 2 1.4c-.4.2-.6.5-.6.9M8 10v.4"/></svg>`,
  shield:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 1.5 13.5 3.5v4c0 3.3-2.4 5.8-5.5 7-3.1-1.2-5.5-3.7-5.5-7v-4z"/><path d="M5.5 8l1.8 1.8 3.4-3.6"/></svg>`,
  dash:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2"><circle cx="8" cy="8" r="5.5"/></svg>`,
  check:`<svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="var(--green)"/><path d="M5 8.2l2 2 4-4.2" stroke="#fff" stroke-width="1.5" fill="none"/></svg>`,
  out:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="var(--orange)" stroke-width="1.3"><rect x="2" y="2" width="12" height="12" rx="2.5"/><path d="M6 10l4-4M6.5 6H10v3.5"/></svg>`,
  push:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 13V4M4.5 7 8 3.5 11.5 7M3 14h10"/></svg>`,
  plus:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>`,
  reload:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>`,
  spin:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="var(--muted)" stroke-width="1.6"><path d="M8 2a6 6 0 1 1-6 6" /></svg>`,
  person:`<svg class="ic" viewBox="0 0 16 16" fill="var(--muted)"><circle cx="8" cy="5" r="3"/><path d="M2.5 14c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5z"/></svg>`,
  octo:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 1.5h6L14.5 5v6L11 14.5H5L1.5 11V5z"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8"/></svg>`,
  wifi:`<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="var(--orange)" stroke-width="1.4"><path d="M1.5 6.5a9.5 9.5 0 0 1 13 0M4 9a6 6 0 0 1 8 0M6.5 11.5a2.5 2.5 0 0 1 3 0"/></svg>`,
};
const rail = (supOn, badge) => `<div class="rail">
  <b>${svgFiles()}</b><b>${svgSearch()}</b><b>${svgBranch()}</b>
  <b class="sel">${svgSessions()}</b>
  <b class="${supOn?'on':''}">${I.bino}${badge?`<span class="badge">${badge}</span>`:''}</b>
  <b>${svgSkills()}</b><b>${svgPlug()}</b><b>${svgPractice()}</b></div>`;

function svgSearch(){return `<svg class="ic" style="width:15px;height:15px" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>`}
